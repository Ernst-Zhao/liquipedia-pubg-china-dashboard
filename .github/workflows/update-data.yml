name: Update Liquipedia data

on:
  schedule:
    # Monday 08:00 China Standard Time (UTC+8).
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liquipedia-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and build data
        env:
          LIQUIPEDIA_REQUEST_DELAY: "31"
          LIQUIPEDIA_USER_AGENT: >-
            ChinaPUBGPrizeDashboard/1.0
            (https://github.com/Ernst-Zhao/liquipedia-pubg-china-dashboard)
        run: python scripts/update_data.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Commit updated data
        run: |
          git config user.name "dashboard-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data.js
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Liquipedia data"
            git push
          fi
